{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
  <h2>{% if producto %}Editar Producto{% else %}Nuevo Producto{% endif %}</h2>

  <form method="POST">
    {% csrf_token %}

    <div class="row">

      <!-- Nombre -->
      <div class="col-md-6 mb-3">
        <label>Nombre</label>
        <input
          type="text"
          name="nombre"
          class="form-control"
          value="{{ producto.nombre|default:'' }}"
          required
        >
      </div>

      <!-- Tipo -->
      <div class="col-md-6 mb-3">
        <label>Tipo de producto</label>
        <input
          type="text"
          name="tipo_producto"
          class="form-control"
          value="{{ producto.tipo_producto|default:'' }}"
          required
        >
      </div>

      <!-- Talla (opcional) -->
      <div class="col-md-4 mb-3">
        <label>Talla <small class="text-muted">(opcional)</small></label>
        <input
          type="text"
          name="talla"
          class="form-control"
          value="{{ producto.talla|default:'' }}"
        >
      </div>

      <!-- Color (opcional) -->
      <div class="col-md-4 mb-3">
        <label>Color <small class="text-muted">(opcional)</small></label>
        <input
          type="text"
          name="color"
          class="form-control"
          value="{{ producto.color|default:'' }}"
        >
      </div>

      <!-- Precio unitario -->
      <div class="col-md-4 mb-3">
        <label>Precio unitario</label>
        <input
          type="number"
          name="precio_unitario"
          class="form-control"
          min="0"
          step="1"
          value="{{ producto.precio_unitario|default:'' }}"
          required
        >
      </div>

      <!-- Cantidad en stock -->
      <div class="col-md-4 mb-3">
        <label>Cantidad en stock</label>
        <input
          type="number"
          name="cantidad_stock"
          class="form-control"
          min="0"
          step="1"
          value="{{ producto.cantidad_stock|default:0 }}"
          required
        >
      </div>

      <!-- Stock crítico (opcional) -->
      <div class="col-md-4 mb-3">
        <label>Stock crítico <small class="text-muted">(opcional)</small></label>
        <input
          type="number"
          name="stock_critico"
          class="form-control"
          min="0"
          step="1"
          value="{{ producto.stock_critico|default:'' }}"
        >
      </div>

      <!-- Margen de ganancia (opcional) -->
      <div class="col-md-4 mb-3">
        <label>Margen de ganancia (%) <small class="text-muted">(opcional)</small></label>
        <input
          type="number"
          name="margen_ganancia"
          class="form-control"
          min="0"
          step="0.01"
          value="{{ producto.margen_ganancia|default:'' }}"
        >
      </div>

      <!-- Distribuidor (opcional) -->
      <div class="col-md-6 mb-3">
        <label>Distribuidor <small class="text-muted">(opcional)</small></label>
        <input
          type="text"
          name="distribuidor"
          class="form-control"
          value="{{ producto.distribuidor|default:'' }}"
        >
      </div>

      <!-- Contacto distribuidor (opcional) -->
      <div class="col-md-6 mb-3">
        <label>Contacto distribuidor <small class="text-muted">(opcional)</small></label>
        <input
          type="text"
          name="contacto_distribuidor"
          class="form-control"
          value="{{ producto.contacto_distribuidor|default:'' }}"
        >
      </div>

    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
