{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido rápido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("{% static 'img/fondo.png' %}") center/cover no-repeat fixed !important;
      font-family: Arial, sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      color: white;
      max-width: 700px;
      margin: 60px auto;
    }

    h3, h5, label {
      color: white;
      font-weight: bold;
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 8px;
      padding: 10px;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    textarea { resize: none; }

    /* Botón verde */
    .btn-success {
      background: rgba(0, 255, 120, 0.45) !important;
      border: none !important;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }
    .btn-success:hover {
      background: rgba(0, 255, 120, 0.7) !important;
    }

    /* Botón gris translúcido */
    .btn-secondary {
      background: rgba(128, 128, 128, 0.45) !important;
      border: none !important;
      font-weight: bold;
      backdrop-filter: blur(4px);
      color: white !important;
    }
    .btn-secondary:hover {
      background: rgba(128, 128, 128, 0.7) !important;
    }

    hr {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      margin: 25px 0;
    }
  </style>
</head>

<body>

<div class="glass-card">
  <h3 class="text-center mb-4">📦 Pedido Rápido</h3>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Datos del cliente -->
    <div class="mb-3">
      <label>Nombre completo</label>
      <input type="text" name="nombre_completo" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Correo electrónico</label>
      <input type="email" name="email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>RUT</label>
      <input type="text" name="rut" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Dirección</label>
      <input type="text" name="direccion" class="form-control" required>
    </div>

    <!-- Producto -->
    <hr>

    <h5 class="text-center mb-3">🛍️ Detalle del producto</h5>

    <div class="mb-3">
      <label>Producto</label>
      <select name="producto" class="form-select" required>
        <option value="">-- Selecciona un producto --</option>
        {% for p in productos %}
          <option value="{{ p.id_producto }}">
            {{ p.nombre }} — {{ p.tipo_producto }}
            ({{ p.color|default:"sin color" }} / {{ p.talla|default:"sin talla" }})
            — ${{ p.precio_unitario }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Cantidad</label>
      <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
    </div>

    <div class="mb-3">
      <label>Mensaje adicional</label>
      <textarea name="mensaje" class="form-control" rows="3"></textarea>
    </div>

    <div class="mb-3">
      <label>Imagen de referencia</label>
      <input type="file" name="imagen" class="form-control" accept="image/*">
    </div>

    <div class="text-center mt-3 mb-2">
      <button type="submit" class="btn btn-success px-4">Enviar Pedido</button>
    </div>

    <!-- Botón de volver al inicio -->
    <div class="text-center mt-3">
      <a href="{% url 'homepage' %}" class="btn btn-secondary px-4">Volver al inicio</a>
    </div>

  </form>
</div>

</body>
</html>
