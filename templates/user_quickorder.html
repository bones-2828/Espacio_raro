{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido rápido con cuenta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: url("{% static 'img/fondo.png' %}") center/cover no-repeat fixed !important;
      font-family: Arial, sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      color: white;
      max-width: 700px;
      margin: 60px auto;
    }

    h3, h5, label {
      color: white;
      font-weight: bold;
    }

    .form-control, .form-select {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 8px;
      padding: 10px;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .form-control[readonly] {
      opacity: 0.9;
    }

    textarea {
      resize: none;
    }

    /* Botón verde */
    .btn-success {
      background: rgba(0, 255, 120, 0.45) !important;
      border: none !important;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    .btn-success:hover {
      background: rgba(0, 255, 120, 0.7) !important;
    }

    /* Botón gris */
    .btn-secondary {
      background: rgba(128, 128, 128, 0.45) !important;
      border: none !important;
      font-weight: bold;
      backdrop-filter: blur(4px);
    }

    .btn-secondary:hover {
      background: rgba(128, 128, 128, 0.7) !important;
    }

    /* Línea separadora translucida */
    hr {
      border-top: 1px solid rgba(255, 255, 255, 0.3);
      margin: 25px 0;
    }

    footer {
      color: white;
      text-align: center;
      margin-top: 40px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<div class="glass-card">
  <h3 class="text-center mb-4">Pedido Rápido con tu cuenta</h3>
  {% if messages %}
<div class="mt-3">
    {% for message in messages %}
        <div class="alert 
            {% if message.tags == 'error' %}alert-danger
            {% elif message.tags == 'success' %}alert-success
            {% elif message.tags == 'warning' %}alert-warning
            {% else %}alert-info{% endif %}
            shadow-sm">
            {{ message }}
        </div>
    {% endfor %}
</div>
{% endif %}


  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <!-- Datos del cliente -->
    <div class="mb-3">
      <label>Nombre y apellido</label>
      <input type="text" class="form-control" value="{{ cliente.nombre }}" readonly>
    </div>

    <div class="mb-3">
      <label>Correo electrónico</label>
      <input type="email" class="form-control" value="{{ cliente.email }}" readonly>
    </div>

    <div class="mb-3">
      <label>RUT</label>
      <input type="text" class="form-control" value="{{ cliente.rut }}" readonly>
    </div>

    <div class="mb-3">
      <label>Dirección</label>
      <input type="text" class="form-control" value="{{ cliente.direccion }}" readonly>
    </div>

    <!-- Detalles del producto -->
    <hr>

    <h5 class="text-center mb-3">Detalle del producto</h5>

    <div class="mb-3">
      <label>Producto</label>
      <select name="producto" class="form-select" required>
        <option value="">-- Selecciona un producto --</option>
        {% for p in productos %}
          <option value="{{ p.id_producto }}">
            {{ p.nombre }} — {{ p.tipo_producto }} 
            ({{ p.color|default:"sin color" }} / {{ p.talla|default:"sin talla" }})
            — ${{ p.precio_unitario }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Cantidad</label>
      <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
    </div>

    <div class="mb-3">
      <label>Mensaje adicional</label>
      <textarea name="mensaje" class="form-control" rows="3" placeholder="Agrega detalles o instrucciones..."></textarea>
    </div>

    <div class="mb-3">
      <label>Imagen de referencia (opcional)</label>
      <input type="file" name="imagen" class="form-control" accept="image/*">
    </div>

    <div class="text-center mt-3">
      <button type="submit" class="btn btn-success px-4">Enviar Pedido</button>
      <a href="{% url 'user_dashboard' %}" class="btn btn-secondary px-4">Volver</a>
    </div>
  </form>
</div>

<footer>
  <p>Proyecto Espacio Raro — Pedido con cuenta</p>
</footer>

</body>
</html>
